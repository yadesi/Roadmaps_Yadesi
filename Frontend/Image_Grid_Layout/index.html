<!DOCTYPE html>
<html lang="en">

    <meta name="keywords" content="HTML, CSS, LAYOUT, GRID">

    <meta property="og:title" content="Image Grid Layout">

<body>
<div class="container">
    <div class="content">
        <div class="first">
            <img class="ill_first" src="images/electric.jpg" alt="">
            <img class="ill_second" src="images/piano.jpg" alt="">

        <div class="second">
            <img class="unordered_first" src="images/e_guitar.jpg" alt="">
            <img class="unordered_second" src="images/trumpet.jpg" alt="">

        <div class="third">
            <img class="ill_first_" src="images/violon.jpg" alt="">
            <img class="ill_second_" src="images/guitar.jpg" alt="">
        </div>
    </div>
</div>
